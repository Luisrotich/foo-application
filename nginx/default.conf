upstream food_api { server api:8000; keepalive 32; }
server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json;
  location / { proxy_pass http://food_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://food_api; expires 7d; add_header Cache-Control "public, immutable"; }
}
