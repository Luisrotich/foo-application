name: Production checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt ruff pip-audit
      - run: ruff check production_app.py
      - run: python -m compileall production_app.py
      - run: pip-audit -r requirements.txt
      - run: "! git grep -nE '(console\\.log|supersecretkey|MPESA_CONSUMER_SECRET=.+)' -- ':!*.example'"
      - run: docker build -t food-ordering:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with: { image-ref: food-ordering:${{ github.sha }}, severity: CRITICAL,HIGH, exit-code: '1' }
